name: check

on:
  push:
    paths-ignore: [website/**]
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  platforms:
    name: platform (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Linux test fonts
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core fonts-liberation fonts-noto-core fonts-stix
      - name: Check the installer without network access
        run: sh tests/install.sh
      - name: Install Claude Code for the plugin checks
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s "$(cat plugins/claude-code/claude-code-version)"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: ./check.sh

  # Keep the branch-protection context independent of matrix job names.
  check:
    if: always()
    needs: platforms
    runs-on: ubuntu-24.04
    steps:
      - run: test '${{ needs.platforms.result }}' = success
